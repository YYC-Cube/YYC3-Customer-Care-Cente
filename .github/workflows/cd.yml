name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  # 质量门禁：确保代码质量
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint check
        run: pnpm run lint

      - name: TypeScript check
        run: pnpm run type-check

      - name: Prettier check
        run: pnpm run format:check

  # 构建 + 部署
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: quality-gate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static export
        run: pnpm run build
        env:
          DEPLOY_TARGET: github-pages
          NODE_ENV: production

      - name: Verify build output
        run: |
          echo "📊 Build output verification"
          echo "============================"
          echo "Output directory size: $(du -sh out/ | cut -f1)"
          echo "Total files: $(find out/ -type f | wc -l)"
          echo "HTML pages: $(find out/ -name '*.html' | wc -l)"
          echo "JS bundles: $(find out/ -name '*.js' | wc -l)"
          echo "CSS files: $(find out/ -name '*.css' | wc -l)"
          echo ""
          echo "CNAME file: $(cat out/CNAME 2>/dev/null || echo 'NOT FOUND')"
          echo ""
          if [ ! -d "out" ]; then
            echo "❌ Build output directory 'out/' not found!"
            exit 1
          fi
          if [ ! -f "out/index.html" ]; then
            echo "❌ index.html not found in output!"
            exit 1
          fi
          echo "✅ Build verification passed"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './out'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        run: |
          echo "🚀 Deployment Summary"
          echo "====================="
          echo "Site URL: ${{ steps.deployment.outputs.page_url }}"
          echo "Custom Domain: ccc.yyc3.top"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Deployed at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
